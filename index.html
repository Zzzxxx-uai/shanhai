<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山海舆图 · 先民观｜绘本</title>
<meta name="description" content="以《山海经》为基底的图文绘本电子书，仿实体书翻页，敦煌重彩插画。">
<link rel="stylesheet" href="assets/css/story.css">
</head>
<body>

<!-- 开场展卷短片 -->
<div class="intro" id="intro" hidden>
  <video class="intro__v" id="intro-video" data-src="assets/video/intro.mp4"
         playsinline muted preload="auto"></video>
  <div class="intro__veil"></div>
  <button class="intro__skip" id="intro-skip" type="button">跳过 · 直接展卷</button>
</div>

<div class="app">

  <header class="bar">
    <div class="bar__brand">山海舆图 <em>先民观</em></div>
    <div class="bar__tools">
      <button class="tbtn" id="btn-toc" type="button">目录</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <button class="nav nav--prev" id="btn-prev" type="button" aria-label="上一页">‹</button>

    <div class="book" id="book">
      <i class="stack stack--l" aria-hidden="true"></i>
      <div class="book__base" id="base">
        <article class="page" id="page"></article>
      </div>
      <div class="book__next" id="next-half"></div>
      <div class="book__cast" id="cast"></div>
      <div class="book__spine" id="spine"></div>
      <div class="flip" id="flip" hidden>
        <div class="flip__face flip__front" id="flip-front"></div>
        <div class="flip__face flip__back" id="flip-back"></div>
      </div>
      <i class="stack stack--r" aria-hidden="true"></i>
      <!-- 左右边缘翻页热区：仅这两条窄带可点击翻页，中间图文区不响应 -->
      <button class="edge edge--left" id="edge-left" type="button" aria-label="翻到上一页"></button>
      <button class="edge edge--right" id="edge-right" type="button" aria-label="翻到下一页"></button>
    </div>

    <button class="nav nav--next" id="btn-next" type="button" aria-label="下一页">›</button>
  </main>

  <footer class="foot">
    <div class="foot__inner">
      <span class="foot__num" id="page-num">1 / 25</span>
      <div class="dots" id="dots"></div>
      <span class="foot__hint" id="foot-hint">点击书页边缘翻页 · 键盘 ← →</span>
    </div>
  </footer>

</div>

<!-- 目录 -->
<div class="sheet" id="sheet-toc" hidden>
  <div class="sheet__box">
    <div class="sheet__head"><span>目录</span><button class="sheet__x" data-close type="button">×</button></div>
    <div class="toc" id="toc"></div>
  </div>
</div>

<script src="assets/js/pages.js"></script>
<script src="assets/js/flip.js"></script>
<script src="assets/js/intro.js"></script>
<script src="assets/js/story.js"></script>
</body>
</html>
